[project]
name = "campsite-watch"
version = "0.1.0"
description = "NAS-friendly campsite availability watcher with notification support."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.44"]

[project.scripts]
campsite-watch = "campsite_watch.app:main"
campsite-watch-api = "campsite_watch.api:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
